
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuickCare - Service Booking</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Navigation Bar -->
    <nav class="navbar">
        <div class="logo">QuickCare</div>

        <div class="nav-links">
            <a href="#home">Home</a>
            <a href="#services">Services</a>
            <a href="#about">About Us</a>
            <a href="#contact">Contact Us</a>
        </div>

        <div class="user">
            <span>Ritika</span>
            <button class="logout">Logout</button>
        </div>
    </nav>

    <!-- Main Section -->
    <main class="container" id="home">

        <!-- Left Section -->
        <section class="cart-section">
            <h2>Added Items</h2>

            <div id="cart-items">
                <p>No items added yet.</p>
            </div>

            <div class="total">
                <h3>Total Amount: ₹<span id="total">0</span></h3>
            </div>
        </section>

        <!-- Right Section -->
        <section class="service-section" id="services">

            <h2>Browse Our Services</h2>
            <p class="description">
                Choose the services you need and book them easily.
            </p>

            <div class="service-list" id="service-list">

                <!-- Services will appear here using JavaScript -->

            </div>

            <div class="cart-buttons">
                <button id="add-cart">Add to Cart</button>
                <button id="book-now">Book Now</button>
            </div>

            <!-- Booking Form -->
            <div class="booking-form" id="booking-form">
                <h2>Book Now</h2>

                <form id="my-form">

                    <input type="text" id="name" placeholder="Full Name" required>

                    <input type="email" id="email" placeholder="Email Address" required>

                    <input type="password" id="password" placeholder="Password" required>

                    <button type="submit">Confirm Booking</button>

                </form>
            </div>

        </section>

    </main>

    <footer id="about">
        <p>© 2026 QuickCare. All Rights Reserved.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
